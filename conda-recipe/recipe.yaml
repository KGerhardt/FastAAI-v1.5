# rattler-build recipe (v1 format), for building a package locally.
#
# `meta.yaml` beside this is the conda-build/bioconda form and is the one a
# bioconda submission uses. This exists because conda-build 26.1.0 fails to
# solve its own build environment here, reporting virtual packages
# (__glibc, __linux, __unix, ...) as dependencies needing to be built.
#
#   rattler-build build -r conda-recipe -c conda-forge -c bioconda
#
# The result lands in output/noarch or output/linux-64 and installs with
#
#   conda install -c ./output -c conda-forge -c bioconda fastaai

schema_version: 1

context:
  name: fastaai
  version: "2.0.0a1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ../fastaai2

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  python:
    entry_points:
      - fastaai = fastaai.cli:main

requirements:
  build:
    - ${{ compiler('c') }}
    - rust >=1.70
  host:
    - python
    - pip
    - maturin >=1.7,<2.0
  run:
    - python
    - pyfastx >=2.0
    - pyrodigal >=3.0
    - pyhmmer >=0.10
    - numpy >=1.21

tests:
  - python:
      imports:
        - fastaai
  - script:
      - fastaai --help
      - fastaai build --help
      - fastaai query --help
      # The bundled model set must survive packaging: without it `fastaai build`
      # cannot run without --hmm, which is the point of shipping it.
      - python -c "from fastaai.search import ModelSet; m = ModelSet(); assert len(m) == 122, len(m); print('bundled models:', len(m), m.fingerprint[:16])"
      # And the engine works end to end on a real single-copy protein.
      - python -c "import fastaai; d = fastaai.Database(['a']); d.add_genome('g', [(0, b'MFRFFKSIGQEMREVDWPNFKQLRKDSSTVISTSVFFIAFLALARLANSIVP')]); d.seal(); r = fastaai.search(d, d, threads=1); print('self jaccard:', r.jaccard[0][0])"

about:
  homepage: https://github.com/KGerhardt/FastAAI-v1.5
  repository: https://github.com/KGerhardt/FastAAI-v1.5
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Fast whole-genome average amino acid identity from single-copy protein tetramer sketches

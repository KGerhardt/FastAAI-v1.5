[package]
name = "fastaai-core"
version = "0.1.0"
edition = "2021"
description = "Counting kernel and inverted index for FastAAI"
license = "GPL-3.0-or-later"
repository = "https://github.com/KGerhardt/FastAAI-v1.5"

[lib]
name = "fastaai_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
needletail = { version = "0.7", default-features = false, features = ["flate2"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

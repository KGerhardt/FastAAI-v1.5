[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "fastaai"
version = "2.0.0a1"
description = "Fast whole-genome average amino acid identity from single-copy protein tetramer sketches"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
# A copy of the repo-root LICENSE: license-files cannot reference a parent
# directory, and the package must carry its own license to be installable.
license-files = ["LICENSE"]
authors = [{ name = "Kenji Gerhardt" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Rust",
]

dependencies = [
    "pyfastx>=2.0",
    "pyrodigal>=3.0",
    "pyhmmer>=0.10",
    "numpy>=1.21",
]

[project.urls]
Homepage = "https://github.com/KGerhardt/FastAAI-v1.5"
Source = "https://github.com/KGerhardt/FastAAI-v1.5"

[project.scripts]
fastaai = "fastaai.cli:main"

[tool.maturin]
features = ["pyo3/extension-module"]
# The bundled model set. Without this the wheel ships no HMMs and `fastaai build`
# cannot run without --hmm.
include = [{ path = "python/fastaai/data/*", format = "wheel" }]
# Evidence, not code. `methods/` is the concordance data and figure behind the
# README's claims — 1.7 MB that no install needs. `prototype/` is outside this
# crate entirely and so cannot reach an artifact.
exclude = [{ path = "methods/**/*", format = "sdist" }]
module-name = "fastaai._core"
python-source = "python"
